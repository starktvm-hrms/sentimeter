# Included in the sentimeter.starkpeople.in server blocks by setup-sources.sh.
# The settings service re-copies this file on start when it changes (tested with nginx -t first).
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}
# Video uploads for publishing (YouTube): large bodies, streamed straight to the service.
location /api/upload/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_body_timeout 300s;
    client_max_body_size 1024m;
    add_header Cache-Control "no-store" always;
}
location /data/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
